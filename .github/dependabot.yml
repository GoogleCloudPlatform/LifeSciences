# Dependabot configuration for the GoogleCloudPlatform/LifeSciences monorepo.
# Configured for grouped security updates only (`open-pull-requests-limit: 0` disables
# scheduled routine version updates while keeping event-driven Dependabot security updates
# active and grouped per target). Note: `schedule` is required by the dependabot.yml schema.
version: 2
updates:
  # Python applications managed with uv (pyproject.toml + uv.lock).
  # Listed as explicit per-directory entries (rather than a wildcard `directories` glob)
  # so each application runs in its own Dependabot job without hitting runner timeouts
  # or scanning non-uv pyproject.toml directories. Add an entry here when adding a new uv app.
  - package-ecosystem: "uv"
    directory: "/applications/pharma-on-gemini-enterprise/argus-on-gemini-enterprise"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 0
    groups:
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/applications/pharma-on-gemini-enterprise/biocompass-on-gemini-enterprise"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 0
    groups:
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/applications/pharma-on-gemini-enterprise/model-garden-on-gemini-enterprise"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 0
    groups:
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/applications/pharma-on-gemini-enterprise/paperbanana-on-gemini-enterprise"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 0
    groups:
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/applications/pharma-on-gemini-enterprise/variant-annotation-agent"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 0
    groups:
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/applications/protein-structure-prediction/foldrun-agent"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 0
    groups:
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/applications/protein-structure-prediction/foldrun-agent/packages/foldrun-common"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 0
    groups:
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/applications/protein-structure-prediction/src/foldrun-analysis-job"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 0
    groups:
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/applications/protein-structure-prediction/src/foldrun-viewer"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 0
    groups:
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/applications/sentinel"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 0
    groups:
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Python CLI tooling managed with hash-pinned pip requirements files
  - package-ecosystem: "pip"
    directory: "/applications/open-agentic-science-engine/tools"
    exclude-paths:
      - "applications/open-agentic-science-engine/tools/host-requirements.txt"
      - "applications/open-agentic-science-engine/tools/pyproject.toml"
      - "**/vendor"
      - "**/vendor/**/*"
      - "**/third_party"
      - "**/third_party/**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Frontend Node.js dependencies (Sentinel web application)
  - package-ecosystem: "npm"
    directory: "/applications/sentinel/frontend"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
