name: PR Code Quality & Unit Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  license-check:
    name: License Header Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run addlicense check
        run: |
          go install github.com/google/addlicense@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          addlicense -check \
            -ignore "**/*.toml" \
            -ignore "**/patches/**" \
            -ignore "**/vendor/**" \
            -ignore "**/third_party/**" \
            .

  ruff-lint-fmt:
    name: Ruff Lint & Format (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "--version"

      - name: Run Ruff format & check per application
        run: |
          exit_code=0
          for cfg in $(find applications -name pyproject.toml -o -name ruff.toml -not -path '*/node_modules/*' -not -path '*/.*'); do
            dir=$(dirname "$cfg")
            echo "Processing Ruff in $dir using local configuration..."
            (
              cd "$dir" || exit 1
              echo "  -> ruff format --check"
              ruff format --check --exclude '*.md' . || exit 1
              echo "  -> ruff check"
              ruff check --exclude '*.md' . || exit 1
            ) || exit_code=1
          done
          exit $exit_code

  node-lint-fmt:
    name: Node Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run lint & format check per Node application
        run: |
          exit_code=0
          for pkg in $(find applications -name package.json -not -path '*/node_modules/*' -not -path '*/.*'); do
            dir=$(dirname "$pkg")
            echo "Processing Node app in $dir..."
            (
              cd "$dir" || exit 1
              if [ -f "package-lock.json" ]; then
                npm ci
              elif [ -f "yarn.lock" ]; then
                yarn install --frozen-lockfile
              else
                npm install
              fi

              if node -e "const pkg = require('./package.json'); process.exit(pkg.scripts && pkg.scripts.lint ? 0 : 1)"; then
                npm run lint || exit 1
              elif [ -f ".eslintrc" ] || [ -f "eslint.config.js" ]; then
                npx eslint . || exit 1
              fi

              if node -e "const pkg = require('./package.json'); process.exit(pkg.scripts && (pkg.scripts.format || pkg.scripts['format:check']) ? 0 : 1)"; then
                if node -e "const pkg = require('./package.json'); process.exit(pkg.scripts['format:check'] ? 0 : 1)"; then
                  npm run format:check || exit 1
                else
                  npm run format -- --check || exit 1
                fi
              elif [ -f ".prettierrc" ] || [ -f "prettier.config.js" ]; then
                npx prettier --check . || exit 1
              fi
            ) || exit_code=1
          done
          exit $exit_code

  terraform-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Run terraform fmt check
        run: terraform fmt -check -recursive applications/

  python-unit-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv & Python 3.11
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Run unit tests across Python applications
        run: |
          set -u
          exit_code=0
          for lock in $(find applications -name uv.lock -not -path '*/node_modules/*' -not -path '*/.*' -not -path '*/.venv/*'); do
            dir=$(dirname "$lock")
            echo "Processing Python project in $dir..."
            (
              cd "$dir" || exit 1
              unit_test_files=$(find tests/unit -maxdepth 3 \( -name 'test_*.py' -o -name '*_test.py' \) 2>/dev/null || true)
              other_test_files=$(find tests -not -path 'tests/integration*' -not -path 'tests/eval*' -not -path 'tests/legacy*' \( -name 'test_*.py' -o -name '*_test.py' \) 2>/dev/null || true)

              if [ -n "$unit_test_files" ]; then
                echo "Running unit tests in $dir/tests/unit..."
                uv sync --frozen
                pytest_status=0
                uv run --frozen pytest tests/unit -q || pytest_status=$?
                if [ $pytest_status -ne 0 ] && [ $pytest_status -ne 5 ]; then
                  echo "Unit tests failed in $dir/tests/unit with exit code $pytest_status"
                  exit 1
                fi
              elif [ -n "$other_test_files" ]; then
                echo "Running tests in $dir/tests (excluding integration and eval)..."
                uv sync --frozen
                pytest_status=0
                uv run --frozen pytest tests --ignore=tests/integration --ignore=tests/eval --ignore=tests/legacy -q || pytest_status=$?
                if [ $pytest_status -ne 0 ] && [ $pytest_status -ne 5 ]; then
                  echo "Tests failed in $dir/tests with exit code $pytest_status"
                  exit 1
                fi
              else
                echo "No unit tests found in $dir, skipping."
              fi
            ) || exit_code=1
          done
          exit $exit_code
