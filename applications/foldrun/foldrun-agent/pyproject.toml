[project]
name = "foldrun-agent"
version = "0.1.0"
description = "AI Agent for protein structure prediction using Google ADK"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "FoldRun Contributors"}
]

dependencies = [
    # ADK and AI Platform
    "google-adk[gcp]>=2.0.0,<3.0.0",
    "google-cloud-aiplatform[adk,agent-engines,evaluation]>=1.156.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "nest-asyncio>=1.5.0",
    # GCP services (previously in MCP server)
    "google-cloud-storage>=2.18.0",
    "google-cloud-filestore>=1.8.0",
    "google-cloud-pipeline-components>=2.20.0",
    "google-cloud-run>=0.10.0",
    "google-cloud-compute>=1.19.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "opentelemetry-instrumentation-fastapi>=0.59b0",
    "google-cloud-batch>=0.17.0",
    "google-cloud-artifact-registry>=1.11.0",
    "google-cloud-service-usage>=1.8.0",
    "google-cloud-resource-manager>=1.12.0",
    # Pipeline and bio
    "kfp>=2.10.0",
    "biopython>=1.81",
    "numpy>=1.24.0",
    "requests",
    "a2a-sdk[http-server]~=0.3.22",
    "aiohttp>=3.13.4",
    "gcsfs>=2024.11.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    "protobuf>=6.31.1,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
]

[project.scripts]
adk = "google.adk.cli:main"

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "foldrun_app",
    "foldrun_app.core",
    "foldrun_app.models",
    "foldrun_app.models.af2",
    "foldrun_app.models.af2.tools",
    "foldrun_app.models.af2.utils",
    "foldrun_app.models.af2.pipeline",
    "foldrun_app.models.af2.pipeline.components",
    "foldrun_app.models.af2.pipeline.pipelines",
    "foldrun_app.skills",
    "foldrun_app.skills.job_submission",
    "foldrun_app.skills.job_management",
    "foldrun_app.skills.results_analysis",
    "foldrun_app.skills.database_queries",
    "foldrun_app.skills.storage_management",
    "foldrun_app.skills.visualization",
]

[tool.setuptools.package-data]
"foldrun_app.models.af2" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "integration: tests that call real LLM (deselect with '-m not integration')",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006", "RUF001", "B905"] # ignore line too long, too complex, unicode characters

[tool.ruff.lint.isort]
known-first-party = ["foldrun_app"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

