[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foldrun-shim"
version = "0.1.0"
description = "Thin-permission native CLI and Jupyter Notebook shim for the FoldRun Direct Cloud Run HTTP Gateway"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "google-auth>=2.29.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
]

[project.scripts]
foldrun = "foldrun_shim.cli:foldrun_main"
boltz = "foldrun_shim.cli:boltz_main"
run_openfold = "foldrun_shim.cli:openfold3_main"
"run_alphafold.py" = "foldrun_shim.cli:alphafold2_main"
run_alphafold = "foldrun_shim.cli:alphafold2_main"
boltzgen = "foldrun_shim.cli:boltzgen_main"
rfd4-generate = "foldrun_shim.cli:rfd4_proteina_main"
bindcraft = "foldrun_shim.cli:bindcraft_main"
"bindcraft.py" = "foldrun_shim.cli:bindcraft_main"
alphafold3 = "foldrun_shim.cli:alphafold3_main"
af3 = "foldrun_shim.cli:alphafold3_main"
"run_alphafold3.py" = "foldrun_shim.cli:alphafold3_main"
run_alphafold3 = "foldrun_shim.cli:alphafold3_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["foldrun_shim*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006", "RUF001", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["foldrun_shim"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**/*.ipynb" = ["E402", "B904"]
