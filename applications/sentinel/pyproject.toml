[project]
name = "sentinel"
version = "0.1.0"
description = "Content analysis starter code to support pharmaceutical regulatory affairs and marketing teams"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Sentinel Contributors" }
]
keywords = ["pharmaceutical", "ai", "youtube", "gemini", "advertisement"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.20",
    "google-genai>=2.0.0",
    "google-adk[gcp,otel-gcp]>=2.6.0,<3.0.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1",
    "pillow>=12.0.0",
    "google-cloud-storage>=2.14.0",
    "starlette>=1.0.1",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "gcsfs>=2024.11.0",
    "google-cloud-aiplatform[agent-engines,evaluation]>=1.156.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "opentelemetry-resourcedetector-gcp<=1.14.0",
    "protobuf>=6.31.1,<7.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.9",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.0.0,<3.0.0",
    "google-cloud-aiplatform[evaluation]>=1.56.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
]

[project.urls]
Homepage = "https://github.com/GoogleCloudPlatform/LifeSciences"
Documentation = "https://github.com/GoogleCloudPlatform/LifeSciences#readme"
Repository = "https://github.com/GoogleCloudPlatform/LifeSciences"
Issues = "https://github.com/GoogleCloudPlatform/LifeSciences/issues"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"] # ignore line too long, too complex

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
