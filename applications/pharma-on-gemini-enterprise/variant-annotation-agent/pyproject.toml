[project]
name = "alphagenome-variant-annotation-agent"
version = "0.1.0"
description = "AlphaGenome — Variant Annotation: Scores variants across 18 AlphaGenome modalities (AVI Phred, Atlas links) and builds ACMG dossiers with ClinVar, gnomAD v4, GWAS Catalog, and PharmGKB."
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.10.0",
    "fastapi>=0.115.0",
    "gcsfs>=2024.11.0",
    "google-adk[gcp,otel-gcp]>=2.9.2,<3.0.0",
    "google-cloud-aiplatform[agent-engines]>=1.156.0,<2.0.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-storage>=2.14.0",
    "google-genai>=1.0.0",
    "httpx>=0.28.1",
    "matplotlib>=3.10.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "pillow>=10.0.0",
    "protobuf>=6.31.1,<7.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest-mock>=3.12.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.0.0,<3.0.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006", "E402", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
