# OASE CLI packaging — PEP 621.
#
# The entry point is `oase = "oase.cli:main"`, which replaces the
# hand-rolled oase-cli shim that install.sh used to symlink into the
# venv.  `pip install -e .` produces a proper console_scripts wrapper
# that works in subshells and loops without PYTHONPATH gymnastics.
#
# Dependencies are declared here for metadata completeness, but
# install.sh still installs them explicitly from requirements.txt and
# requirements-science.txt (separate transactions, core-fatal /
# science-survivable).  install.sh uses `--no-deps` when running the
# editable install so these declarations do not override that flow.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oase"
version = "0.3.0"  # Keep in sync with CLI_VERSION in oase/core/env.py
description = "Execution surface for OASE agent tooling"
requires-python = ">=3.11"

# Core CLI dependencies — mirrors tools/requirements.txt.
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "mistune>=3.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "numpy>=1.26",
    "zstandard>=0.22",
    "google-cloud-aiplatform>=1.60",
    "jsonpath-ng>=1.6",
]

[project.optional-dependencies]
# Full optional stack: requirements-science.txt plus requirements-hypex.txt.
# `pip install -e ".[science]"` is equivalent to install.sh's full
# (non --core-only) install.
science = [
    "rdkit>=2024.3.1",
    "meeko>=0.5",
    "gemmi>=0.7",
    "pubchempy>=1.0.4",
    "biopython>=1.84",
    "prody>=2.4",
    "chembl-webresource-client>=0.10.9",
    "scipy>=1.12",
    "scikit-learn>=1.3",
    "networkx>=3.0",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.scripts]
oase = "oase.cli:main"

[tool.setuptools.packages.find]
include = ["oase*"]

[tool.setuptools.package-data]
oase = ["site_templates/**/*.html"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C4", "B", "UP", "RUF"]
ignore = ["E501", "C901", "B006"]
